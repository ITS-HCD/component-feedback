<div class="nys-grid-container layouts">
  <section class="layouts__section">
    <h2>Wide container</h2>
    <p>At 40rem and wider, the prompt and buttons share one row.</p>
    <nys-feedback
      heading="How did we do?"
      text="You just renewed your professional license."
    ></nys-feedback>
  </section>

  <section class="layouts__section">
    <h2>Narrow container</h2>
    <p>Below 40rem, everything stacks in one centered column.</p>
    <div class="layouts__phone">
      <nys-feedback
        heading="How did we do?"
        text="You just renewed your professional license."
      ></nys-feedback>
    </div>
  </section>

  <section class="layouts__section">
    <h2>After someone answers</h2>
    <p>The <code>submitted</code> attribute shows the thank-you message.</p>
    <nys-feedback submitted value="good"></nys-feedback>
  </section>
</div>
